<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" fill="none" role="img" aria-label="Personal Guide character">
  <defs>
    <linearGradient id="goldBody" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="45%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="diamond" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ECFEFF"/>
      <stop offset="50%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="tux" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f2937"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
  </defs>
  <!-- legs dangling -->
  <path d="M78 198 L70 255 L82 255 L88 200 Z" fill="url(#tux)"/>
  <path d="M122 198 L118 255 L130 255 L132 200 Z" fill="url(#tux)"/>
  <ellipse cx="76" cy="258" rx="14" ry="6" fill="#111827"/>
  <ellipse cx="124" cy="258" rx="14" ry="6" fill="#111827"/>
  <!-- tuxedo body -->
  <path d="M55 110 C55 95 70 88 100 88 C130 88 145 95 145 110 L148 198 C148 210 138 218 100 218 C62 218 52 210 52 198 Z" fill="url(#tux)"/>
  <!-- gold/diamond torso shine under lapels -->
  <path d="M88 120 L100 205 L112 120 Z" fill="url(#goldBody)" opacity="0.95"/>
  <path d="M94 128 L100 155 L106 128 Z" fill="url(#diamond)" opacity="0.85"/>
  <!-- lapels -->
  <path d="M70 112 L88 120 L78 175 L58 140 Z" fill="#0b1220"/>
  <path d="M130 112 L112 120 L122 175 L142 140 Z" fill="#0b1220"/>
  <!-- bow tie -->
  <path d="M86 118 L100 126 L114 118 L100 132 Z" fill="#F59E0B"/>
  <circle cx="100" cy="125" r="4" fill="#FDE68A"/>
  <!-- arms -->
  <path d="M55 120 C40 135 38 165 48 185" stroke="#111827" stroke-width="16" stroke-linecap="round"/>
  <path d="M145 120 C160 135 162 165 152 185" stroke="#111827" stroke-width="16" stroke-linecap="round"/>
  <circle cx="48" cy="188" r="10" fill="url(#goldBody)"/>
  <circle cx="152" cy="188" r="10" fill="url(#goldBody)"/>
  <!-- diamond cuff accents -->
  <path d="M48 180 L52 188 L48 196 L44 188 Z" fill="url(#diamond)"/>
  <path d="M152 180 L156 188 L152 196 L148 188 Z" fill="url(#diamond)"/>
  <!-- head -->
  <ellipse cx="100" cy="62" rx="36" ry="40" fill="url(#goldBody)"/>
  <!-- diamond cheek sparkles -->
  <path d="M72 70 L76 78 L72 86 L68 78 Z" fill="url(#diamond)"/>
  <path d="M128 70 L132 78 L128 86 L124 78 Z" fill="url(#diamond)"/>
  <!-- cheeky big smile -->
  <path d="M78 72 Q100 98 122 72" stroke="#7C2D12" stroke-width="4" fill="#FEF3C7"/>
  <path d="M84 76 Q100 92 116 76" fill="#FBBF24"/>
  <!-- eyes -->
  <ellipse cx="86" cy="55" rx="7" ry="9" fill="#111827"/>
  <ellipse cx="114" cy="55" rx="7" ry="9" fill="#111827"/>
  <circle cx="88" cy="52" r="2.5" fill="#fff"/>
  <circle cx="116" cy="52" r="2.5" fill="#fff"/>
  <!-- brows -->
  <path d="M76 42 Q86 36 94 42" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
  <path d="M106 42 Q114 36 124 42" stroke="#92400E" stroke-width="3" stroke-linecap="round"/>
  <!-- hair / top sheen -->
  <path d="M70 40 Q100 18 130 40 Q118 28 100 26 Q82 28 70 40 Z" fill="#B45309"/>
</svg>
