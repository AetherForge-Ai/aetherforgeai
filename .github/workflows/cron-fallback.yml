# b51 BS-01 (TT b50: the 16:07 UTC broker-sync slot ran 4 h 52 min late on 19 Oct; the 19:23 UTC
# track-record slot never ran). GitHub drops or delays scheduled runs under load. This hourly watchdog
# looks at cron.yml's job history and, when a job's last success is older than its interval plus slack,
# dispatches cron.yml for that job. It never edits cron.yml.
# Safety: it uses only the workflow's own GITHUB_TOKEN (actions read/write on this repo). It reads no
# repo secrets, prints no secrets, calls no app route itself and sends no email.
name: cron-fallback
on:
  schedule:
    # b53: GitHub dropped the 04:37, 05:37 and 06:37 UTC slots on 20 Oct (syntax valid, main is default,
    # workflow active, dispatch works). Two minutes per hour so one dropped slot is covered; the busy
    # check, the concurrency group and the track-record slot key make a double run a no-op.
    - cron: "7,37 * * * *"
  workflow_dispatch:
permissions:
  actions: write
  contents: read
concurrency:
  group: cron-fallback
  cancel-in-progress: false
jobs:
  watchdog:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - name: Dispatch overdue cron jobs
        run: |
          set -euo pipefail
          now=$(date -u +%s)
          # A cron.yml run already queued or running covers it; do not stack another.
          busy=$(gh api "repos/$REPO/actions/workflows/cron.yml/runs?per_page=10" --jq '[.workflow_runs[] | select(.status=="queued" or .status=="in_progress")] | length')
          if [ "$busy" != "0" ]; then echo "cron.yml has $busy run(s) queued or running; nothing to do."; exit 0; fi
          ids=$(gh api "repos/$REPO/actions/workflows/cron.yml/runs?per_page=40" --jq '.workflow_runs[].id')
          last_ok() {
            local job="$1" best=0 t
            for id in $ids; do
              t=$(gh api "repos/$REPO/actions/runs/$id/jobs" --jq "[.jobs[] | select(.name==\"$job\" and .conclusion==\"success\") | .completed_at] | first // empty")
              if [ -n "$t" ]; then t=$(date -u -d "$t" +%s); if [ "$t" -gt "$best" ]; then best=$t; fi; fi
            done
            echo "$best"
          }
          check() {
            local job="$1" limit_h="$2" last age
            last=$(last_ok "$job")
            age=$(( (now - last) / 3600 ))
            if [ "$last" = "0" ] || [ $(( now - last )) -gt $(( limit_h * 3600 )) ]; then
              echo "::notice title=cron-fallback::$job last succeeded ${age}h ago (limit ${limit_h}h); dispatching cron.yml job=$job"
              gh workflow run cron.yml --repo "$REPO" --ref main -f job="$job"
              return 0
            fi
            echo "$job last succeeded ${age}h ago (limit ${limit_h}h): on time"
          }
          # broker-sync: daily (24 h) + 3 h slack. track-record: every 6 h + 2 h slack.
          check broker-sync 27
          check track-record 8
