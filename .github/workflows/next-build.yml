# b54a: Totalum's exact preview build command, as a required check. No secrets, no deploy.
name: next-build
on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: next-build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Exact Totalum build command
        run: NEXT_TELEMETRY_DISABLED=1 DISABLE_OPENNEXT=true npx next build
