# Scheduled calls to the app's cron routes (GOAL-LOCK G-20 track record; broker sync).
# GitHub runs scheduled workflows only from the default branch (main). No email routes are called.
# b37: as of b33 there were 0 scheduled runs. main is the default branch, the workflow is active and the
# syntax is valid, but the only commit that touched this file on main was the b32 mirror force-push.
# Schedules are registered when a push to the default branch changes the workflow, so this edit lands
# through a normal develop → main PR merge. It also moves the times off :00 and :15, which GitHub
# delays or drops under load.
name: cron

on:
  schedule:
    - cron: "7 16 * * *"   # broker sync, daily 16:07 UTC (05:07 NZDT / 04:07 NZST)
    - cron: "23 */6 * * *" # track record, every 6 hours at :23 UTC
  workflow_dispatch:
    inputs:
      job:
        description: "Which route to call"
        required: true
        default: "both"
        type: choice
        options: [both, broker-sync, track-record]

permissions:
  contents: read

concurrency:
  group: cron-${{ github.event.schedule || github.event.inputs.job }}
  cancel-in-progress: false

env:
  BASE_URL: https://aetherforgeai.co.nz

jobs:
  broker-sync:
    if: github.event.schedule == '7 16 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'track-record')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Call /api/cron/broker-sync
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET is not set in repo secrets."; exit 1; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 30 --retry-all-errors \
            --connect-timeout 20 --max-time 1500 -X POST \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -o /tmp/out.json -w "HTTP %{http_code}\n" \
            "${BASE_URL}/api/cron/broker-sync"
          head -c 500 /tmp/out.json; echo

  track-record:
    if: github.event.schedule == '23 */6 * * *' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job != 'broker-sync')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Call /api/cron/track-record
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${CRON_SECRET}" ]; then echo "CRON_SECRET is not set in repo secrets."; exit 1; fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 --retry-all-errors \
            --connect-timeout 20 --max-time 300 \
            -H "x-cron-secret: ${CRON_SECRET}" \
            -o /tmp/out.json -w "HTTP %{http_code}\n" \
            "${BASE_URL}/api/cron/track-record"
          head -c 500 /tmp/out.json; echo
